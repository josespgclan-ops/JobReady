name: Publicar Angular en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - uses: actions/configure-pages@v5
      - name: Compilar Angular para GitHub Pages
        run: npm run build -- --base-href /JobReady/
        working-directory: frontend
      - name: Permitir abrir rutas de Angular directamente
        run: cp frontend/dist/JobReady/browser/index.html frontend/dist/JobReady/browser/404.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist/JobReady/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
